[tools]
doppler = "3.77.0"
"github:a-h/templ" = "0.3.1070"
"github:pressly/goose" = "3.29.0"
go = "1.27"
golangci-lint = "2.15.0"
sqlc = "1.31.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.lint]
description = "Check code with golangci-lint"
run = "golangci-lint run"

[tasks.format]
description = "Format code with gofmt"
run = "go fmt ./..."

[tasks.check]
description = "Check dependencies for vulnerabilities"
run = "govulncheck ./..."

[tasks.precommit]
description = "Format, lint, test, and scan for vulnerabilities in that order"
run = [
  { task = "format" },
  { task = "lint" },
  { task = "test" },
  { task = "check" },
]
