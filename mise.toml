[tools]
doppler = "3.77.0"
"github:a-h/templ" = "0.3.1070"
"github:pressly/goose" = "3.29.0"
go = "1.27"
golangci-lint = "2.15.0"
sqlc = "1.31.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.generate]
description = "Generate Go code from templ files"
run = "templ generate"

[tasks.format]
description = "Format templ files with templ, and Go files with golangci-lint"
run = [
  "templ fmt .",
  "golangci-lint fmt",
]

[tasks.lint]
description = "Check code with golangci-lint"
run = "golangci-lint run"

[tasks.check]
description = "Check dependencies for vulnerabilities"
run = "govulncheck ./..."

[tasks.precommit]
description = "Format, generate, lint, test, and scan for vulnerabilities in that order"
run = [
  { task = "format" },
  { task = "generate" },
  { task = "lint" },
  { task = "test" },
  { task = "check" },
]
